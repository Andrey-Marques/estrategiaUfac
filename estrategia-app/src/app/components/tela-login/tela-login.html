<div class="login-container">
  <form (ngSubmit)="login()" [attr.inert]="recuperacaoAberta ? '' : null">
    <h2>Login</h2>
    <div class="campo">
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username"  placeholder="Usuário"  [(ngModel)]="username">
    </div>
    <div class="campo">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" placeholder="Senha" [(ngModel)]="password">
    </div>
    <button id="esqueci-senha" class="link-recuperacao" type="button" (click)="abrirRecuperacao()">Esqueci minha senha</button>
    <p *ngIf="erroLogin" class="mensagem-erro" role="alert">{{ erroLogin }}</p>
    <button type="submit" [disabled]="entrando">
      {{ entrando ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</div>

<div *ngIf="recuperacaoAberta" class="recuperacao-overlay" (click)="fecharRecuperacao()">
  <section id="modal-recuperacao" class="recuperacao-modal" role="dialog" aria-modal="true" aria-labelledby="titulo-recuperacao" (click)="$event.stopPropagation()">
    <header><h2 id="titulo-recuperacao">Recuperar senha</h2><button type="button" aria-label="Fechar" (click)="fecharRecuperacao()">×</button></header>
    <form #formRecuperacao="ngForm" (ngSubmit)="enviarRecuperacao()">
      <p>Informe o e-mail cadastrado para receber um link de redefinição de senha.</p>
      <div class="campo"><label for="email-recuperacao">E-mail</label><input id="email-recuperacao" name="emailRecuperacao" type="email" email required maxlength="254" autocomplete="email" [(ngModel)]="emailRecuperacao" [disabled]="enviandoRecuperacao"></div>
      <p *ngIf="mensagemRecuperacao" class="mensagem-sucesso" role="status">{{ mensagemRecuperacao }}</p>
      <p *ngIf="erroRecuperacao" class="mensagem-erro" role="alert">{{ erroRecuperacao }}</p>
      <footer><button class="cancelar" type="button" (click)="fecharRecuperacao()">Fechar</button><button type="submit" [disabled]="formRecuperacao.invalid || enviandoRecuperacao">{{ enviandoRecuperacao ? 'Enviando…' : 'Enviar link' }}</button></footer>
    </form>
  </section>
</div>
