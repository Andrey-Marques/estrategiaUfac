<app-header-publico></app-header-publico>

<div class="pagina">
  <main class="conteudo-principal">

    <app-breadcrumb></app-breadcrumb>


    <section class="introducao">

      <h1>
        Painel de Unidades
      </h1>

      <p>
        Cada unidade possui ações que contribuem para o alcance
        dos objetivos estratégicos.
      </p>

      <p>
        Selecione uma unidade para visualizar sua contribuição com projetos, iniciativas e indicadores.
      </p>

    </section>


    <!-- =====================================================
         UNIDADES
         ===================================================== -->
    <section class="unidades">

      <!-- Linha 1 -->

      <button class="unidade" *ngFor="let uni of unidades()"
        routerLink="/acoes-estrategicas" [queryParams]="{ unidade: uni.id }">

        <strong>{{uni.sigla}}</strong>

        <span>{{uni.nome}}</span>

      </button>


    </section>

  </main>


  <app-rodape></app-rodape>

</div>
