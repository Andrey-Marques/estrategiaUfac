<app-header-publico></app-header-publico>

<div class="pagina">
  <main class="conteudo-principal">

    <!-- Breadcrumb -->
    <nav class="breadcrumb" aria-label="Navegação">

      <a routerLink="/pagina-inicial">
          <svg
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M3 10.5L12 3L21 10.5V20C21 20.55 20.55 21 20 21H15V14H9V21H4C3.45 21 3 20.55 3 20V10.5Z"
              fill="currentColor"
            />
          </svg>
      </a>

      <span>›</span>
      <span>Painel de Unidades</span>

    </nav>


    <section class="introducao">

      <h1>
        Painel de Unidades
      </h1>

      <p>
        Cada unidade possui ações que contribuem para o alcance
        dos objetivos estratégicos.
      </p>

      <p>
        Selecione uma unidade para visualizar sua contribuição com projetos, iniciativas e indicadores.
      </p>

    </section>


    <!-- =====================================================
         UNIDADES
         ===================================================== -->
    <section class="unidades">

      <!-- Linha 1 -->

      <button class="unidade" *ngFor="let uni of unidades()"
        routerLink="/acoes-estrategicas" [queryParams]="{ unidade: uni.id }">

        <strong>{{uni.sigla}}</strong>

        <span>{{uni.nome}}</span>

      </button>


    </section>

  </main>


  <app-rodape></app-rodape>

</div>
