    <section class="info-bar">
        <div class="info-bar_unidade">
            <span class="info-bar_subtitulo">UNIDADE RESPONSÁVEL</span>
            <h1 class="info-bar_titulo">{{unidade()?.sigla || 'UNIDADE'}}</h1>
            <p class="info-bar_descricao">{{unidade()?.nome || 'Carregando unidade...'}}</p>
        </div>

        <div class="info-bar_contagem">
            <div class="card-contagem">
                <span class="card-contagem_valor">{{resumo().projetos}}</span>
                <span class="card-contagem_label">PROJETOS</span>
            </div>
            <div class="divisor_contagem"></div>    
            <div class="card-contagem">
                <span class="card-contagem_valor">{{resumo().indicadores}}</span>
                <span class="card-contagem_label">INDICADORES</span>
            </div>
            <div class="divisor_contagem"></div>    
            <div class="card-contagem">
                <span class="card-contagem_valor">{{resumo().iniciativas}}</span>
                <span class="card-contagem_label">INICIATIVAS</span>
            </div>
        </div>
    </section>
