<div class="rodape-paginacao">
  <span class="quantidade-resultados" aria-live="polite">Mostrando {{ inicio() }}–{{ fim() }} de {{ total() }} resultados</span>
  <div class="controles-paginacao">
    <label class="tamanho-pagina">Por página
      <select aria-label="Registros por página" [value]="porPagina()" (change)="alterarTamanho($event)">
        <option [value]="10">10</option><option [value]="20">20</option><option [value]="50">50</option>
      </select>
    </label>
    <nav class="paginacao" aria-label="Paginação da listagem">
      <button type="button" aria-label="Página anterior" [disabled]="pagina() <= 1" (click)="paginaAlterada.emit(pagina() - 1)"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
      <ng-container *ngFor="let numero of paginas()">
        <span class="reticencias" *ngIf="numero === 0" aria-hidden="true">…</span>
        <button *ngIf="numero > 0" type="button" [class.pagina-atual]="numero === pagina()" [attr.aria-current]="numero === pagina() ? 'page' : null" [attr.aria-label]="'Página ' + numero" (click)="paginaAlterada.emit(numero)">{{ numero }}</button>
      </ng-container>
      <button type="button" aria-label="Próxima página" [disabled]="pagina() >= totalPaginas()" (click)="paginaAlterada.emit(pagina() + 1)"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
    </nav>
  </div>
</div>
