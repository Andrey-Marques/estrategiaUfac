<div class="main">
  <div class="pagina-dados">

    <div class="cabecalho-pagina">
      <div class="titulo-area">
        <h1>Meus Dados</h1>
        <p>Gerencie suas informações pessoais e de acesso.</p>
      </div>
    </div>

    <div class="quadro-dados">
      <div class="cabecalho-dados">
        <span class="icone-cadeado">♙</span>
        <span class="titulo-tabela">DADOS PESSOAIS</span>
      </div>

      <div class="conteudo-dados">
        <div class="grid-dados">

          <div class="campo">
            <label for="nome">NOME COMPLETO</label>
            <input
              id="nome"
              type="text"
              [value]="usuario.nome_completo || ''"
              disabled
            >
          </div>

          <div class="campo">
            <label for="email">E-MAIL INSTITUCIONAL</label>
            <input
              id="email"
              type="email"
              [(ngModel)]="usuario.email"
              name="email"
              [readonly]="!modoEdicaoDados"
              [class.campo-bloqueado]="!modoEdicaoDados"
            >
          </div>

          <div class="campo">
            <label for="vinculo">VÍNCULO</label>
            <input
              id="vinculo"
              type="text"
              [value]="obterPapel()"
              disabled
            >
          </div>

          <div class="campo campo-lotacao">
            <label for="lotacao">LOTAÇÃO ATUAL</label>
            <input
              id="lotacao"
              type="text"
              [value]="usuario.unidade_nome || 'Não informada'"
              disabled
            >
          </div>

          <div class="campo">
            <label for="nome-social">NOME SOCIAL</label>
            <input
              id="nome-social"
              type="text"
              [(ngModel)]="usuario.nome_social"
              name="nome_social"
              [readonly]="!modoEdicaoDados"
              [class.campo-bloqueado]="!modoEdicaoDados"
            >
          </div>

          <div class="campo">
            <label for="cpf">CPF</label>
            <input
              id="cpf"
              type="text"
              [(ngModel)]="usuario.cpf"
              name="cpf"
              [readonly]="!modoEdicaoDados"
              [class.campo-bloqueado]="!modoEdicaoDados"
            >
          </div>

        </div>

        <div class="espaco-botao">

          <button
            class="btn botao-editar"
            type="button"
            *ngIf="!modoEdicaoDados"
            (click)="editarDados()"
          >
            Editar
            <span class="icone-editar">↗</span>
          </button>

          <button
            class="btn botao-cancelar"
            type="button"
            *ngIf="modoEdicaoDados"
            (click)="cancelarDados()"
          >
            Cancelar
          </button>

          <button
            class="btn botao-salvar"
            type="button"
            *ngIf="modoEdicaoDados"
            (click)="salvarDados()"
          >
            Salvar
            <span class="icone-editar">↗</span>
          </button>

        </div>
      </div>
    </div>

    <div class="quadro-credenciais">

      <div class="cabecalho-credenciais">
        <div class="titulo-credenciais">
          <span class="icone-cadeado">♙</span>
          <span class="titulo-tabela">CREDENCIAIS DE ACESSO</span>
        </div>
      </div>

      <div class="conteudo-credenciais">
        <div class="grid-credenciais">

          <div class="campo">
            <label for="usuario">NOME DE USUÁRIO</label>
            <input
              id="usuario"
              type="text"
              [value]="usuario.username || ''"
              disabled
            >
            <span class="descricao">
              Utilizado para acesso aos sistemas integrados e rede.
            </span>
          </div>

          <div class="campo">
            <label for="senha">SENHA</label>
            <input
              id="senha"
              type="password"
              value="********"
              disabled
            >
          </div>

        </div>
      </div>

    </div>

  </div>
</div>
